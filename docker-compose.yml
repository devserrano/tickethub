# Servicios de apoyo para desarrollo local.
#   Solo infraestructura (corres la API desde IntelliJ):  docker compose up -d
#   Todo, incluida la API en contenedor:                   docker compose --profile app up -d --build

services:
  mysql:
    image: mysql:8.4
    container_name: tickethub-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      # root solo para administrar; la app usa DB_USER, que solo tiene permisos sobre DB_NAME
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD, copia .env.example a .env}
      MYSQL_DATABASE: ${DB_NAME:-tickethub}
      MYSQL_USER: ${DB_USER:-tickethub_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD, copia .env.example a .env}
      TZ: UTC
    ports:
      # 127.0.0.1: solo tu máquina puede conectarse, no la red de la escuela
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: tickethub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - miniodata:/data

  # Crea el bucket de adjuntos una sola vez al levantar
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/tickethub-attachments;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: tickethub-mail
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # bandeja web: http://localhost:8025

  api:
    profiles: ["app"]
    build: .
    container_name: tickethub-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # dentro de la red de Docker el host es el nombre del servicio y el puerto es el interno (3306)
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-tickethub}
      DB_USER: ${DB_USER:-tickethub_app}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      S3_ENDPOINT: http://minio:9000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  miniodata:
